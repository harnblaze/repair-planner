<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Нет соединения — Планировщик</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #f1f3f6;
        color: #1b2430;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 28px 24px;
        border-radius: 12px;
        background: #fff;
        text-align: center;
        box-shadow: 0 1px 2px rgb(27 36 48 / 0.06);
      }
      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        margin-bottom: 14px;
        border-radius: 10px;
        background: #2f55c8;
        color: #fff;
      }
      h1 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
      p { margin: 0 0 20px; color: #55606e; }
      button {
        min-height: 36px;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        background: #2f55c8;
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #2f55c8; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <span class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3.2" width="12" height="10.5" rx="1.6" />
          <path d="M2 6.4h12M5.4 1.8v2.6M10.6 1.8v2.6" />
        </svg>
      </span>
      <h1>Нет соединения с интернетом</h1>
      <p>Проверьте связь. Страница откроется сама, как только связь появится.</p>
      <button type="button" id="reload">Обновить</button>
    </main>
    <script>
      document.getElementById("reload").addEventListener("click", () => location.reload());
      // Связь вернулась — открываем ту страницу, которую пытались загрузить.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
